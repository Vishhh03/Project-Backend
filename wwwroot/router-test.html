<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Router Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .nav-links a { margin-right: 10px; padding: 5px 10px; background: #007bff; color: white; text-decoration: none; }
        .nav-links a:hover { background: #0056b3; }
        #content { margin-top: 20px; padding: 20px; background: #f8f9fa; min-height: 200px; }
        .test-results { background: #e9ecef; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Router Test Page</h1>
    
    <div class="test-section">
        <h2>Navigation Links</h2>
        <div class="nav-links">
            <a href="#/">Home</a>
            <a href="#/hotels">Hotels</a>
            <a href="#/hotels/123">Hotel Detail (ID: 123)</a>
            <a href="#/login">Login</a>
            <a href="#/register">Register</a>
            <a href="#/bookings">Bookings</a>
            <a href="#/nonexistent">404 Test</a>
        </div>
    </div>
    
    <div class="test-section">
        <h2>Router Controls</h2>
        <button onclick="testNavigation()">Test Navigation</button>
        <button onclick="testBackForward()">Test Back/Forward</button>
        <button onclick="testParameterExtraction()">Test Parameters</button>
        <button onclick="showRouterInfo()">Show Router Info</button>
    </div>
    
    <div class="test-section">
        <h2>Test Results</h2>
        <div id="test-results" class="test-results">
            Test results will appear here...
        </div>
    </div>
    
    <div class="test-section">
        <h2>Content Area</h2>
        <div id="content">
            Content will be loaded here by the router...
        </div>
    </div>
    
    <script src="js/utils/router.js"></script>
    <script>
        // Initialize router for testing
        const router = new Router();
        const contentDiv = document.getElementById('content');
        const resultsDiv = document.getElementById('test-results');
        
        function logResult(message) {
            const timestamp = new Date().toLocaleTimeString();
            resultsDiv.innerHTML += `<div>[${timestamp}] ${message}</div>`;
        }
        
        // Set up test routes
        router.addRoute('/', () => {
            contentDiv.innerHTML = '<h3>Home Page</h3><p>Welcome to the home page!</p>';
            logResult('Home route loaded');
        });
        
        router.addRoute('/hotels', () => {
            contentDiv.innerHTML = '<h3>Hotels Page</h3><p>Browse all available hotels.</p>';
            logResult('Hotels route loaded');
        });
        
        router.addRoute('/hotels/:id', (params) => {
            contentDiv.innerHTML = `<h3>Hotel Detail</h3><p>Hotel ID: ${params.id}</p>`;
            logResult(`Hotel detail route loaded with ID: ${params.id}`);
        });
        
        router.addRoute('/login', () => {
            contentDiv.innerHTML = '<h3>Login Page</h3><p>Please log in to your account.</p>';
            logResult('Login route loaded');
        });
        
        router.addRoute('/register', () => {
            contentDiv.innerHTML = '<h3>Register Page</h3><p>Create a new account.</p>';
            logResult('Register route loaded');
        });
        
        router.addRoute('/bookings', () => {
            contentDiv.innerHTML = '<h3>Bookings Page</h3><p>Manage your bookings.</p>';
            logResult('Bookings route loaded');
        });
        
        router.addRoute('*', () => {
            contentDiv.innerHTML = '<h3>404 - Page Not Found</h3><p>The requested page could not be found.</p>';
            logResult('404 route loaded');
        });
        
        // Test functions
        function testNavigation() {
            logResult('Testing programmatic navigation...');
            router.navigate('/hotels');
            setTimeout(() => {
                router.navigate('/hotels/456');
                setTimeout(() => {
                    router.navigate('/login');
                    logResult('Navigation test completed');
                }, 500);
            }, 500);
        }
        
        function testBackForward() {
            logResult('Testing back/forward navigation...');
            logResult(`Can go back: ${router.canGoBack()}`);
            logResult(`Can go forward: ${router.canGoForward()}`);
            
            if (router.canGoBack()) {
                router.back();
                logResult('Navigated back');
            }
        }
        
        function testParameterExtraction() {
            logResult('Testing parameter extraction...');
            const testUrl = '/hotels/789?tab=reviews&sort=price';
            router.navigate(testUrl);
            
            setTimeout(() => {
                const currentRoute = router.getCurrentRoute();
                if (currentRoute) {
                    logResult(`Current path: ${currentRoute.path}`);
                    logResult(`Parameters: ${JSON.stringify(currentRoute.params)}`);
                    logResult(`Query params: ${JSON.stringify(currentRoute.queryParams)}`);
                }
            }, 100);
        }
        
        function showRouterInfo() {
            logResult('Router Information:');
            logResult(`Current path: ${router.getCurrentPath()}`);
            logResult(`History length: ${router.getHistory().length}`);
            logResult(`Can go back: ${router.canGoBack()}`);
            logResult(`Can go forward: ${router.canGoForward()}`);
            
            const routes = router.getRoutes();
            logResult(`Registered routes: ${routes.size}`);
            for (const [path] of routes) {
                logResult(`- ${path}`);
            }
        }
        
        // Initialize
        logResult('Router test page initialized');
        logResult('Click navigation links or test buttons to verify router functionality');
    </script>
</body>
</html>

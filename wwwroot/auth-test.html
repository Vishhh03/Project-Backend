<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Components Test</title>
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="main-content">
        <div class="app-container">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1>Authentication Components Test</h1>
                <div style="margin-bottom: 1rem;">
                    <button id="showLogin" class="btn btn-primary">Test Login Component</button>
                    <button id="showRegister" class="btn btn-secondary">Test Register Component</button>
                </div>
            </div>
            
            <!-- Component Container -->
            <div id="component-container"></div>
        </div>
    </div>
    
    <!-- JavaScript Files -->
    <script src="js/utils/api-client.js"></script>
    <script src="js/utils/storage-service.js"></script>
    <script src="js/utils/router.js"></script>
    <script src="js/utils/auth-state-manager.js"></script>
    <script src="js/services/auth-service.js"></script>
    <script src="js/components/auth/login-component.js"></script>
    <script src="js/components/auth/register-component.js"></script>
    
    <script>
        let currentComponent = null;
        
        document.getElementById('showLogin').addEventListener('click', function() {
            // Clear previous component
            if (currentComponent && typeof currentComponent.destroy === 'function') {
                currentComponent.destroy();
            }
            
            // Create container for login component
            const container = document.getElementById('component-container');
            container.innerHTML = '<div id="login-test-container"></div>';
            
            // Initialize login component
            try {
                currentComponent = new LoginComponent('login-test-container');
                console.log('Login component initialized successfully');
            } catch (error) {
                console.error('Error initializing login component:', error);
                container.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        });
        
        document.getElementById('showRegister').addEventListener('click', function() {
            // Clear previous component
            if (currentComponent && typeof currentComponent.destroy === 'function') {
                currentComponent.destroy();
            }
            
            // Create container for register component
            const container = document.getElementById('component-container');
            container.innerHTML = '<div id="register-test-container"></div>';
            
            // Initialize register component
            try {
                currentComponent = new RegisterComponent('register-test-container');
                console.log('Register component initialized successfully');
            } catch (error) {
                console.error('Error initializing register component:', error);
                container.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        });
        
        // Initialize with login component by default
        document.getElementById('showLogin').click();
    </script>
</body>
</html>
